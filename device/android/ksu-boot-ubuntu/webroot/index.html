<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boot to Ubuntu</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f7;
  --card: #ffffff;
  --fg: #16181d;
  --muted: #5c6270;
  --line: #dcdfe5;
  --accent: #b4441b;
  --accent-fg: #ffffff;
  --bad: #a11b1b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --card: #1d2026;
    --fg: #e9eaee;
    --muted: #9aa1ae;
    --line: #2e323a;
    --accent: #d8622f;
    --accent-fg: #14161a;
    --bad: #f08a8a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
}
main { width: 100%; max-width: 420px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
p.lede { color: var(--muted); margin: 0 0 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; font-variant-numeric: tabular-nums; }
button {
  width: 100%;
  padding: 15px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--accent-fg);
  background: var(--accent);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
button[disabled] { opacity: .45; cursor: default; }
pre {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 14px 0 0;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--muted);
  font-size: .85rem;
}
.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Boot to Ubuntu</h1>
  <p class="lede">Both systems boot from slot A. The button writes the Ubuntu boot image into boot_a, reads it back, and restarts the tablet. The active slot is never changed.</p>

  <div class="card">
    <dl>
      <dt>Slot A holds</dt><dd id="holds">…</dd>
      <dt>Ubuntu image</dt><dd id="ubuntu">…</dd>
      <dt>Android copy</dt><dd id="android">…</dd>
    </dl>
  </div>

  <div class="card">
    <button id="go" disabled>Reboot to Ubuntu</button>
    <pre id="log">Reading the switch store…</pre>
  </div>
</main>
<script>
// KernelSU WebUI exposes a single native bridge, ksu.exec(command, optionsJson,
// callbackName): it runs the command as root and calls window[callbackName]
// with (errno, stdout, stderr).  Wrapped in a promise here.
let seq = 0;
function exec(command, timeoutMs) {
  return new Promise((resolve, reject) => {
    if (typeof ksu === 'undefined' || !ksu.exec) {
      reject(new Error('KernelSU WebUI bridge is not available'));
      return;
    }
    const name = '__ksu_cb_' + (seq++);
    const timer = setTimeout(() => { delete window[name]; reject(new Error('timed out')); }, timeoutMs);
    window[name] = (errno, stdout, stderr) => {
      clearTimeout(timer);
      delete window[name];
      resolve({ errno: Number(errno), stdout: String(stdout || ''), stderr: String(stderr || '') });
    };
    try {
      ksu.exec(command, JSON.stringify({}), name);
    } catch (error) {
      clearTimeout(timer);
      delete window[name];
      reject(error);
    }
  });
}

// Called by its module path, not through PATH: whether KernelSU mounts the
// module's system/ over /system differs between builds, and the module
// directory is a real path either way.  The switcher hashes a 192 MiB
// partition and both stored images, so the timeouts are generous.
const MODULE = '/data/adb/modules/liuqin_boot_ubuntu';
const SWITCH = 'LIUQIN_SWITCH_LOG=/data/adb/ksu/log/liuqin-switch.log sh ' +
  MODULE + '/system/bin/liuqin-switch';

const holdsEl = document.getElementById('holds');
const ubuntuEl = document.getElementById('ubuntu');
const androidEl = document.getElementById('android');
const logEl = document.getElementById('log');
const button = document.getElementById('go');

function say(text, bad) {
  logEl.textContent = text;
  logEl.classList.toggle('bad', Boolean(bad));
}

function field(text, pattern) {
  const match = text.match(pattern);
  return match ? match[1].trim() : '?';
}

async function refresh() {
  try {
    const status = await exec(SWITCH + ' status', 120000);
    const text = status.stdout;
    holdsEl.textContent = field(text, /^boot_a holds:\s*(.*)$/m);
    ubuntuEl.textContent = field(text, /^store\/ubuntu\s+(.*)$/m);
    androidEl.textContent = field(text, /^store\/android\s+(.*)$/m);
    if (status.errno) {
      say('liuqin-switch status failed:\n' + (status.stderr || status.stdout), true);
      return;
    }
    if (!/^store\/ubuntu\s+ok\b/m.test(text)) {
      say('The Ubuntu root carries no usable Ubuntu boot image; refusing.\n\n' + text, true);
      return;
    }
    button.disabled = false;
    say(text.trim());
  } catch (error) {
    say(String(error && error.message ? error.message : error), true);
  }
}

button.addEventListener('click', async () => {
  if (!confirm('Write the Ubuntu boot image into boot_a and restart into Ubuntu now?\n\nUnsaved work in Android will be lost.')) {
    return;
  }
  button.disabled = true;
  say('Writing and verifying boot_a. The tablet restarts as soon as the image reads back correctly…');
  try {
    const result = await exec(SWITCH + ' to-ubuntu', 300000);
    if (result.errno) {
      button.disabled = false;
      say('Not switched (exit ' + result.errno + '):\n' + (result.stderr || '') + (result.stdout || ''), true);
      return;
    }
    say(result.stdout.trim() + '\n\nRebooting…');
  } catch (error) {
    button.disabled = false;
    say(String(error && error.message ? error.message : error), true);
  }
});

refresh();
</script>
</body>
</html>
