name: Build liuqin kernel
description: Shared kernel build for the integration and kernel repositories
inputs:
  kernel-repository:
    description: Kernel repository in owner/name form
    required: true
  revision:
    description: Exact development commit; empty selects the product lock
    default: ''
runs:
  using: composite
  steps:
    - name: Select kernel
      id: source
      shell: bash
      env:
        REVISION: ${{ inputs.revision }}
      run: |
        python3 - <<'PY'
        import json, os, re
        lock = json.load(open('project/kernel/source.json'))
        sha = os.environ['REVISION'] or lock['commit']
        assert re.fullmatch(r'[0-9a-f]{40}', sha)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write('sha=' + sha + '\n')
        PY
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.kernel-repository }}
        ref: ${{ steps.source.outputs.sha }}
        path: linux-sm8450-liuqin
        fetch-depth: 0
        persist-credentials: false
    - name: Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu python3 ccache kmod rsync
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: liuqin-ccache-${{ runner.os }}-${{ hashFiles('project/device/configs/**', 'project/tools/build-liuqin-kernel.py') }}-${{ steps.source.outputs.sha }}
        restore-keys: |
          liuqin-ccache-${{ runner.os }}-${{ hashFiles('project/device/configs/**', 'project/tools/build-liuqin-kernel.py') }}-
    - name: Build
      shell: bash
      env:
        REVISION: ${{ inputs.revision }}
        CCACHE_MAXSIZE: 2G
      run: |
        args=()
        if [[ -n "$REVISION" ]]; then args+=(--revision "$REVISION"); fi
        python3 project/tools/build-liuqin-kernel.py --jobs 4 "${args[@]}"
        KERNEL_OUT="$GITHUB_WORKSPACE/project/out/kernel" \
          sh project/tools/build-liuqin-kernel-modules.sh
        cd project/out/kernel-modules
        sha256sum modules.tar modules.manifest kernel.release kernel.commit > SHA256SUMS
    - name: Preserve failed configuration
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: liuqin-config-failure-${{ steps.source.outputs.sha }}
        if-no-files-found: ignore
        include-hidden-files: true
        path: |
          project/out/kernel/.config
          project/out/kernel/build-inputs.json
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: liuqin-kernel-${{ steps.source.outputs.sha }}
        if-no-files-found: error
        include-hidden-files: true
        path: |
          project/out/kernel/arch/arm64/boot/Image
          project/out/kernel/arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dtb
          project/out/kernel/SHA256SUMS
          project/out/kernel/build-info.json
          project/out/kernel/.config
          project/out/kernel/vmlinux
          project/out/kernel/System.map
          project/out/kernel-modules/
        retention-days: 14
